# example.com —— 两周年纪念站点（接管主域名）
#
# 这份配置**取代** AIfood（AI-food）在主域名上的原 server block。
# AIfood 的后端是 Spring Boot，监听 127.0.0.1:8080，早已停止（只剩一个 Exited 的
# redis 容器）；它的 /admin/ 管理端、/ws/ WebSocket、/uploads/ 上传直出三段在本项目
# 里都不存在，所以一并删除，不给死路留入口。
# 原文件顶部的 upstream app_main 与 map $http_upgrade $connection_upgrade 只被本文件
# 自己用到（已在服务器上 grep 确认，/etc/nginx 下无第二处引用），随本文件一起去掉。
#
# 应用事实（与 /opt/two-years 一致）：
#   systemd 单元 two-years.service，WorkingDirectory=/opt/two-years
#   Node 走 /opt/node24/bin/node（系统 node 是 v20，别碰）
#   只监听回环 127.0.0.1:8300，HOST 写死在 /etc/two-years/two-years.env
#   外部只能经 nginx 进来 —— 这是应用 trust proxy = 1 成立的前提（src/app.js）：
#   nginx 不传 X-Forwarded-For 的话，限流会按 127.0.0.1 算，任何人连错 5 次两个人一起被锁。
#
# 照片绝不走静态目录：照片只存在 data/photos（700 权限），读图只有
# GET /api/photo/:id 这一条带鉴权的路（src/routes.js）。本文件因此
# **不为照片开任何直出 location**，静态根也只有 /opt/two-years/public。
# 应用侧还有一道硬断言：照片目录一旦落进 public/，它宁可起不来也不开门（src/photos.js）。
#
# 装法：
#   sudo cp deploy/nginx/ljhlovefj-top.conf /etc/nginx/sites-available/example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# reload 前 nginx 进程里缓存着 7 月那张已于 2026-10-01 过期的证书；磁盘上
# /etc/letsencrypt/live/example.com/ 的证书是有效的（到 2026-11-30）。
# 也就是说 reload 这一次顺手就把过期问题修掉了，不需要再跑 certbot。
#
# 回滚（本次替换即备份点 —— 覆盖前先留一份）：
#   sudo cp /etc/nginx/sites-available/example.com /etc/nginx/sites-available/example.com.aifood.bak
#   要退回 AIfood：
#     sudo cp /etc/nginx/sites-available/example.com.aifood.bak /etc/nginx/sites-available/example.com
#     sudo nginx -t && sudo systemctl reload nginx
#   域名字符串 example.com 已逐字节核对过两处，都不是凭记忆写的：
#     sudo ls -1 /etc/letsencrypt/live/                                  → example.com
#     sudo grep ssl_certificate /etc/nginx/sites-available/example.com → 同上
#   这串与本站域名只差一个字母（正文里多一个 a），而那正是最容易手打错的一种。
#   写错一位就是 nginx 起不来或证书找不到，
#   而配置文件里它出现在 server_name 与两条 ssl_certificate 上，共 4 处。
#   sites-enabled 里是软链，不用动，替换 sites-available 的实体文件即可。
#   另一条退路是子域名方案 deploy/nginx/two-years.conf（DNS 未生效，留作参考）。

# ---------------------------------------------------------------- :80
# 只放 ACME challenge（certbot --webroot -w /var/www/letsencrypt 要往这里写），
# 其余全量 301 到 HTTPS。
server {
    listen 80;
    server_name example.com;

    client_max_body_size 12m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- :443
server {
    listen 443 ssl http2;
    server_name example.com;

    # 证书路径沿用原样，一个字没改。
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # ---- 以下五项逐字抄自原 AIfood 配置，不自己发明 ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # ---- 抄到这里结束 ----
    # 原配置里**没有** ssl_prefer_server_ciphers，所以这里也不加：TLS1.3 下它本来就
    # 不起作用，凭空补一条等于"看起来更安全"，实际什么都没变。
    # HSTS 带 includeSubDomains 是原样继承的（子域名会被强制 HTTPS）——与替换前行为一致。

    # 必须 > 10MB：src/photos.js 的 MAX_UPLOAD_BYTES = 10 * 1024 * 1024（10MiB），
    # 而 nginx 默认 1MB。不改的话手机传原图直接 413，界面上只显示"网络不太顺"。
    # 12m − 10MiB = 2MiB 余量，给 multipart 的边界与头部开销（这些也算在
    # client_max_body_size 里），够一张手机原图。
    client_max_body_size 12m;

    # 探活打到应用上，不返回写死的 JSON。
    # 写死的 200 只能证明 nginx 活着，证明不了 8300 上有东西；打应用才知道服务是不是真在。
    # /api/status 是公开路由（封印页倒计时也要用），探活不会泄露任何内容。
    location = /healthz {
        proxy_pass http://127.0.0.1:8300/api/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        access_log off;
    }

    # ---- API：全部转应用。鉴权、限流、时间锁闸门都在应用里，这里不重复实现。 ----
    #
    # 用 `~*`（忽略大小写）而不是前缀 `location /api/`：前缀匹配是**大小写敏感**的，
    # `/API/SHARED`、`/Api/shared` 匹配不上，会掉进下面 SPA 的 `try_files ... /index.html`，
    # 拿到 **200 + 应用外壳**。于是应用里那道「未解锁一律 404」的闸门根本没被走到 ——
    # 门禁（check-boot.mjs）断言 `/API/SHARED → 404`，而线上是 200，判据和实际对不上。
    # 改成 `~*` 之后所有大小写变体都转给应用，由应用自己判。
    location ~* ^/api/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 取 $proxy_add_x_forwarded_for（含真实客户端地址），应用 trust proxy=1
        # 只认最右边一跳，客户端伪造的左侧条目会被忽略 —— 限流因此按真实客户端算。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 本 server 只 listen 443 ssl，$scheme 恒为 https。应用靠这个头决定
        # 会不会给会话 cookie 加 Secure（src/auth.js 的 isSecureRequest）：
        # 传成 http 就等于凭据明文发一次，所以这一行不能改。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 手机直传原图可能慢一点，别让 nginx 先掐断
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 不做任何缓存与改写：这里没配 proxy_cache，响应不会被存；
        # 全文件也没有 sub_filter —— 时间锁未解锁时的那个 404 必须逐字原样透传，
        # 一旦被中间层缓存重放，开门后还读不到。
    }

    # ---- 照片目录：显式 404，不吃 SPA 回落 ----
    # CONSTRAINTS.md §2 写的是「未解锁时猜静态路径（/photos/…、/uploads/… 等）一律 404」。
    # 下面那个 `try_files ... /index.html` 会把任何未知路径变成 **200 + index.html**。
    # 那**不是泄漏**（回的是应用外壳，一个字节照片都没有，而且照片物理上在
    # /opt/two-years/data/photos，不在这个 root 下），但字面上不是 404。
    # 留着这个不一致的代价是：日后有人拿这条约束当判据时，看到 200 会以为出事了，
    # 而真正要查的时候又查不出东西。这里挡掉，让约束的字面与实际对上。
    # `(/|$)` 是关键：只写 `/` 结尾的话，`/photos`（无尾斜杠）匹配不上，
    # 同样掉进 SPA 回落变成 200。带 `$` 把「就是这个目录」也算进去。
    location ~ ^/(photos|data|uploads|public)(/|$) {
        return 404;
    }

    # ---- 静态资源：应用自己的 public/，SPA 回落 ----
    # 只服务前端构建产物。照片不在这个根下，所以这里不存在照片直出路径。
    location / {
        root /opt/two-years/public;
        try_files $uri $uri/ /index.html;
    }
}
