# example.com:8443 —— 观察者预览实例（**测试专用**，第二台）
#
# 这份配置把**测试实例**（/opt/two-years-test，systemd two-years-test.service）
# 暴露到公网，供人在开门前亲手对照两个视角：登录【改这里：doorCode】看【改这里：heroCode】写的东西、
# 登录【改这里：heroCode】看【改这里：doorCode】写的，或者开 /#observe 一次看全。
#
# ⚠️ 它**不碰生产**。主域名的 443 server block 一个字没改，/opt/two-years
#    一个字节没动，两者是两个进程、两个数据目录、两个 unit。
#
# 为什么是「新端口」而不是子域：现有证书是**单域名**的
# （`openssl x509` 的 SAN 只有 DNS:example.com，没有通配符），
# 上子域要重新签证书，而签证书要先有 DNS A 记录 —— 那是手工步骤。
# 同一个名字换端口，证书原样能用，nginx 只是多一个 server 块。
#
# 为什么实例仍然只听回环：应用 trust proxy=1（src/app.js）成立的前提是
# 「能直连进程的人只有本机 nginx」。这里 `proxy_set_header X-Forwarded-For
# $proxy_add_x_forwarded_for` 必须留着 —— 少了它限流会按 127.0.0.1 算，
# 任何人连错 5 次两个视角一起被锁。
#
# 装法：
#   sudo cp deploy/nginx/two-years-preview-8443.conf \
#           /etc/nginx/sites-available/two-years-preview-8443
#   sudo ln -s /etc/nginx/sites-available/two-years-preview-8443 \
#           /etc/nginx/sites-enabled/two-years-preview-8443
#   sudo nginx -t && sudo systemctl reload nginx
#
# 回滚：
#   sudo rm /etc/nginx/sites-enabled/two-years-preview-8443
#   sudo nginx -t && sudo systemctl reload nginx
#   （安全组那条 8443 规则要另外去控制台删；留在那儿也不通，没有 server 就没人在听）
#
# ⚠️ 打开 8443 等于把一个用真生日做口令的实例挂到公网（口令是产品定义，
#    值不在本文件里重复；观察者 PIN 与其中一方同值，见 CONSTRAINTS.md §2b）。
#    生产实例不受影响、仍然锁着、库里仍然是空的。

server {
    listen 8443 ssl http2;
    server_name example.com;

    # 证书沿用主域名那份，不重新签（SAN 里没有通配符，子域也用不了它）。
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # 下面五项逐字抄自主域名的 server 块（它们本身是从原 AIfood 配置继承下来的），
    # 不自己发明一套「预览专用」的 TLS 参数：两处用同一套密码套件，
    # 换浏览器行为时只需要改一个地方。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 与主域名一致：必须 > MAX_UPLOAD_BYTES（10MiB），否则手机传原图 413。
    client_max_body_size 12m;

    # 探活打应用，不回写死的 JSON —— 写死的 200 只证明 nginx 活着。
    location = /healthz {
        proxy_pass http://127.0.0.1:8301/api/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        access_log off;
    }

    # `~*`（忽略大小写）而不是前缀 `location /api/`：前缀匹配大小写敏感，
    # `/API/SHARED` 会掉进下面的 SPA 回落拿到 200 + index.html，
    # 应用里那道闸门根本没被走到。与主域名同一处理由。
    location ~* ^/api/ {
        proxy_pass http://127.0.0.1:8301;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 这个端口只 listen ssl，$scheme 恒为 https。应用靠它决定
        # 会不会给凭据 cookie 加 Secure（src/auth.js 的 isSecureRequest）——
        # 传成 http 就是凭据明文发一次，这一行不能改。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 不配 proxy_cache、不配 sub_filter。时间锁未解锁时那个 404
        # 必须逐字原样透传，被中间层缓存重放的话开门后还读不到。
    }

    # 照片目录显式 404，不吃 SPA 回落。与主域名同一条，字面对上 CONSTRAINTS §2。
    location ~ ^/(photos|data|uploads|public)(/|$) {
        return 404;
    }

    # 静态资源走**测试实例自己的** public/，不是生产那份 ——
    # 走错了就会出现「页面是新的、数据是旧的」这种最难查的错配。
    location / {
        root /opt/two-years-test/public;
        try_files $uri $uri/ /index.html;
    }
}
