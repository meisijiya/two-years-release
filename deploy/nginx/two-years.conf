# example.com —— 两周年纪念站点
#
# ⚠️ **不要动 /etc/nginx/sites-enabled/example.com**。那是另一个项目（AI-food）
#    的配置，它的后端 8080 已经停了、证书也已过期，但它还在那儿。
#    这个站点走**子域名**，两边彻底隔离。
#
# 装法：
#   sudo cp deploy/nginx/two-years.conf /etc/nginx/sites-available/two-years
#   sudo ln -sf /etc/nginx/sites-available/two-years /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书（DNS 记录生效之后）：
#   sudo certbot certonly --webroot -w /var/www/letsencrypt \
#        -d example.com
# 签完把下面 ssl_certificate 两行取消注释。

# 请求体上限要 > 10MB：src/photos.js 的 MAX_UPLOAD_BYTES 是 10MB，
# 而 nginx 默认 1MB —— 不改的话手机传原图会收到 413，界面上只显示「网络不太顺」。
client_max_body_size 12m;

# HTTP：只放 ACME challenge，其余全跳 HTTPS
server {
    listen 80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name example.com;

    # 证书由 certbot 签发。签之前先建个自签的占位，否则 nginx 起不来。
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 12m;

    # nginx 自带的健康检查，不经过应用：应用挂了这里也该 200，
    # 两者要能分开看（否则分不清是应用的问题还是 nginx 的问题）。
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"UP","app":"two-years","scheme":"https"}';
        access_log off;
    }

    # 其余全部转给应用。应用自己处理 SPA 静态资源与 /api/*。
    location / {
        proxy_pass         http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # 上传一张原图可能慢一点，别让 nginx 先掐断
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 照片是私有内容，不能被中间缓存或浏览器以外的层存下来
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }
}
